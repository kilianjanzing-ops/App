  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); background: var(--ht-bg, #F1F1F6); opacity: 0.96; z-index: 1000; pointer-events: none; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; background: var(--ht-bg, #F1F1F6); }
  body { font-family: 'Google Sans Flex', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-variation-settings: "ROND" 30; color: #191A23; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
  .ht-display { font-weight: 750; font-variation-settings: "ROND" 100; letter-spacing: -0.015em; }
  .ht-mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  input, textarea, button, select { font-family: inherit; font-variation-settings: inherit; }
  input::placeholder, textarea::placeholder { color: #A3A6B5; opacity: 1; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #5145E5; outline-offset: 1px; }
  button { cursor: pointer; transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease, border-radius 0.2s ease; -webkit-user-select: none; user-select: none; }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 2px solid #5145E5; outline-offset: 2px; }
  .ht-card { border-radius: 28px; box-shadow: 0 1px 2px rgba(25, 26, 35, 0.05); }
  .ht-group { display: flex; flex-direction: column; gap: 3px; }
  .ht-group > .ht-card, .ht-group > * > .ht-card { border-radius: 10px; }
  .ht-group > :first-child.ht-card, .ht-group > :first-child > .ht-card { border-top-left-radius: 28px; border-top-right-radius: 28px; }
  .ht-group > :last-child.ht-card, .ht-group > :last-child > .ht-card { border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
  .ht-field:focus-within { box-shadow: inset 0 0 0 2px #5145E5; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=time]::-webkit-calendar-picker-indicator { opacity: 0.45; }

  @keyframes htFadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes htPopIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes htPulse { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .ht-fade-in { animation: htFadeInUp 0.35s ease both; }
  .ht-pop { animation: htPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .ht-pulse { animation: htPulse 0.4s ease; }

  @media (prefers-reduced-motion: reduce) {
    .ht-fade-in, .ht-pop, .ht-pulse { animation: none !important; }
    button, button:active { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#232A3D;max-width:480px;margin:0 auto;">' +
        '<h2 style="font-size:16px;">Fehler beim Laden</h2>' +
        '<p style="white-space:pre-wrap;font-size:12px;color:#8B879A;line-height:1.5;">' +
        (e.message || 'Unbekannter Fehler') +
        (e.filename ? ('<br>' + e.filename + ':' + e.lineno) : '') +
        '</p></div>';
    }
  });
</script>

<script>
  // Brücke zwischen Web-App und Android-App (Capacitor).
  // Im Browser passiert hier nur die Service-Worker-Registrierung wie bisher.
  (function () {
    var cap = window.Capacitor;
    var isNative = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
    var api = { isNative: isNative, ready: Promise.resolve() };
    window.AbendrundeNative = api;

    if (!isNative) {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
      return;
    }

    document.documentElement.classList.add('is-native');
    var cache = {};
    function plugin(name) {
      if (!cache[name]) cache[name] = (cap.Plugins && cap.Plugins[name]) || cap.registerPlugin(name);
      return cache[name];
    }
    var PREFIX = 'health-';

    // Datenspeicher: localStorage bleibt die schnelle Arbeitskopie, zusätzlich wird jeder
    // Wert in den nativen App-Einstellungen (SharedPreferences) gesichert. Falls Android den
    // WebView-Speicher je leert, wird beim Start daraus wiederhergestellt.
    api.mirror = function (key, raw) {
      try {
        plugin('Preferences').set({ key: key, value: raw }).catch(function () {});
      } catch (e) {}
    };
    api.ready = (async function () {
      try {
        var Preferences = plugin('Preferences');
        var res = await Preferences.keys();
        var stored = (res && res.keys) || [];
        for (var i = 0; i < stored.length; i++) {
          var k = stored[i];
          if (k.indexOf(PREFIX) !== 0 || localStorage.getItem(k) !== null) continue;
          var got = await Preferences.get({ key: k });
          if (got && got.value != null) localStorage.setItem(k, got.value);
        }
        var localKeys = [];
        for (var j = 0; j < localStorage.length; j++) {
          var lk = localStorage.key(j);
          if (lk && lk.indexOf(PREFIX) === 0) localKeys.push(lk);
        }
        for (var m = 0; m < localKeys.length; m++) {
          var key = localKeys[m];
          var local = localStorage.getItem(key);
          var pref = await Preferences.get({ key: key });
          if (!pref || pref.value !== local) await Preferences.set({ key: key, value: local });
        }
      } catch (e) {
        console.error('Speicherabgleich fehlgeschlagen', e);
      }
    })();

    // Dateien (Backup, CSV) über den Teilen-Dialog sichern – Browser-Downloads gibt es in der App nicht.
    api.saveFile = async function (filename, content) {
      var written = await plugin('Filesystem').writeFile({
        path: filename,
        data: content,
        directory: 'CACHE',
        encoding: 'utf8'
      });
      try {
        await plugin('Share').share({ title: filename, url: written.uri, dialogTitle: 'Datei sichern oder teilen' });
      } catch (e) {
        if (!/cancel/i.test(String(e && e.message))) throw e;
      }
    };

    // Android-Zurück-Taste: die App entscheidet zuerst (Unterseite → zurück), sonst App minimieren.
    try {
      plugin('App').addListener('backButton', function () {
        var notHandled = window.dispatchEvent(new CustomEvent('abendrunde-back', { cancelable: true }));
        if (notHandled) plugin('App').minimizeApp().catch(function () {});
      });
    } catch (e) {}

    // Statusleiste: helle Symbole auf dem dunklen Kopf (per Konfiguration),
    // Navigationsleiste: dunkle Symbole auf der hellen Leiste unten.
    try {
      plugin('SystemBars').setStyle({ style: 'LIGHT', bar: 'NavigationBar' }).catch(function () {});
    } catch (e) {}
  })();
