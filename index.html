<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Icons (eigene, einfache SVGs) ---------- */
function Icon({ name, size = 18, style, className }) {
  const common = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', style, className };
  const paths = {
    moon: <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" />,
    heart: <path d="M12 20.5s-7.5-4.7-9.8-9.4A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.8 4.9c-2.3 4.7-9.8 9.4-9.8 9.4Z" />,
    footprints: <>
      <circle cx="8" cy="7" r="2.2" /><path d="M6 12v3a2 2 0 0 0 4 0v-1" />
      <circle cx="16" cy="14" r="2.2" /><path d="M14 19v-3a2 2 0 0 1 4 0v1" />
    </>,
    wine: <><path d="M7 3h10l-1 7a4 4 0 0 1-8 0Z" /><path d="M12 14v7M9 21h6" /></>,
    coffee: <>
      <path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z" />
      <path d="M17 9h1.5a2.3 2.3 0 0 1 0 4.6H17" />
      <path d="M7 4c0 1-1 1-1 2M11 4c0 1-1 1-1 2" />
    </>,
    dumbbell: <><rect x="2.5" y="9" width="3" height="6" rx="1" /><rect x="18.5" y="9" width="3" height="6" rx="1" /><path d="M5.5 12h13" strokeWidth="3" /></>,
    smartphone: <><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M11 19h2" /></>,
    trendingUp: <><path d="M3 17l6-6 4 4 8-8" /><path d="M15 6h6v6" /></>,
    calendar: <><rect x="3.5" y="5" width="17" height="16" rx="2" /><path d="M8 3v4M16 3v4M3.5 10h17" /></>,
    chevronLeft: <path d="M15 6l-6 6 6 6" />,
    chevronRight: <path d="M9 6l6 6-6 6" />,
    save: <><path d="M5 3h11l3 3v15H5Z" /><path d="M8 3v6h8V3M8 21v-7h8v7" /></>,
    sparkles: <><path d="M12 3v4M12 17v4M3 12h4M17 12h4" /><path d="M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" /></>,
    x: <path d="M6 6l12 12M18 6L6 18" />,
    download: <><path d="M12 4v11M8 11l4 4 4-4" /><path d="M5 19h14" /></>,
    upload: <><path d="M12 19V8M8 12l4-4 4 4" /><path d="M5 19h14" /></>,
  };
  return <svg {...common}>{paths[name]}</svg>;
}

/* ---------- Konfiguration ---------- */
const STORAGE_KEY = 'health-entries';
const CUSTOM_HABITS_KEY = 'health-custom-habits';
const CUSTOM_METRICS_KEY = 'health-custom-metrics';
const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

const COLORS = {
  ink: '#232A3D', dusk: '#5B6B8C', ember: '#E3A857', sage: '#7A9B7E',
  rose: '#C4707A', plum: '#8B6C9C', periwinkle: '#8CA0C4', wine: '#9C4A5C',
  custom: '#5C8A8A', mist: '#F3F1F6', line: '#E1DFE6', muted: '#8B879A',
};

const HABITS = [
  { key: 'alcohol', label: 'Alkohol', iconName: 'wine' },
  { key: 'caffeine', label: 'Koffein', iconName: 'coffee' },
  { key: 'exercise', label: 'Sport', iconName: 'dumbbell' },
  { key: 'screenBeforeBed', label: 'Bildschirm vorm Schlafen', iconName: 'smartphone' },
];

const METRICS = [
  { key: 'sleepScore', label: 'Schlafscore', unit: '', color: COLORS.dusk, habitOffset: -1 },
  { key: 'sleepHours', label: 'Schlafdauer', unit: 'Std', color: COLORS.periwinkle, habitOffset: -1 },
  { key: 'restingHR', label: 'Ruhepuls', unit: 'bpm', color: COLORS.rose, habitOffset: -1 },
  { key: 'steps', label: 'Schritte', unit: '', color: COLORS.sage },
  { key: 'mood', label: 'Stimmung', unit: '/5', color: COLORS.ember },
  { key: 'stress', label: 'Stress', unit: '/5', color: COLORS.plum },
  { key: 'alcoholUnits', label: 'Alkoholmenge', unit: ' Gl.', color: COLORS.wine },
];

/* ---------- Datum (lokal, kein UTC-Versatz) ---------- */
function toDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function todayStr() { return toDateStr(new Date()); }
function formatDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}
function emptyEntry(date) {
  return {
    date, sleepHours: '', sleepScore: '', restingHR: '', steps: '',
    alcohol: null, alcoholUnits: '', caffeine: null, caffeineLate: null,
    exercise: null, screenBeforeBed: null, mood: null, stress: null, notes: ''
  };
}

/* ---------- Lokaler Speicher ---------- */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) { console.error('Speichern fehlgeschlagen:', e); return false; }
}

/* ---------- Export / Import ---------- */
function triggerDownload(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportJSON(entries, customHabits, customMetrics) {
  const payload = { exportedAt: new Date().toISOString(), version: 1, entries, customHabits, customMetrics };
  triggerDownload(JSON.stringify(payload, null, 2), `abendrunde-backup-${todayStr()}.json`, 'application/json');
}
function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV(entries, customHabits, customMetrics) {
  const rows = Object.values(entries).sort((a, b) => a.date.localeCompare(b.date));
  const baseCols = ['date', 'sleepHours', 'sleepScore', 'restingHR', 'steps', 'alcohol', 'alcoholUnits', 'caffeine', 'caffeineLate', 'exercise', 'screenBeforeBed', 'mood', 'stress', 'notes'];
  const cols = [...baseCols, ...customHabits.map(h => h.key), ...customMetrics.map(m => m.key)];
  const header = cols.join(',');
  const lines = rows.map(r => cols.map(c => csvEscape(r[c])).join(','));
  triggerDownload([header, ...lines].join('\n'), `abendrunde-export-${todayStr()}.csv`, 'text/csv');
}

/* ---------- Wochentag-Muster ---------- */
function weekdayPattern(sortedEntries, metricKey) {
  const buckets = WEEKDAYS.map(label => ({ label, items: [] }));
  sortedEntries.forEach(e => {
    if (e[metricKey] === '' || e[metricKey] == null) return;
    const d = new Date(e.date + 'T00:00:00');
    buckets[d.getDay()].items.push(Number(e[metricKey]));
  });
  return buckets.map(b => ({
    label: b.label, n: b.items.length,
    avg: b.items.length ? b.items.reduce((s, v) => s + v, 0) / b.items.length : null,
  }));
}

/* ---------- Dosis-Wirkung (Menge statt nur Ja/Nein) ---------- */
function computeDoseResponse(sortedEntries, entries, metric, doseKey) {
  const offset = metric.habitOffset || 0;
  const pairs = [];
  sortedEntries.forEach(e => {
    if (e[metric.key] === '' || e[metric.key] == null) return;
    const doseEntry = offset === 0 ? e : entries[addDays(e.date, offset)];
    if (!doseEntry) return;
    const doseVal = doseEntry[doseKey];
    if (doseVal === '' || doseVal == null) return;
    pairs.push({ dose: Number(doseVal), value: Number(e[metric.key]) });
  });
  if (pairs.length < 6) return null;
  const doses = pairs.map(p => p.dose);
  const min = Math.min(...doses), max = Math.max(...doses);
  if (max - min < 0.0001) return null;
  const w = (max - min) / 3;
  const buckets = [
    { label: 'Niedrig', range: [min, min + w], items: [] },
    { label: 'Mittel', range: [min + w, min + 2 * w], items: [] },
    { label: 'Hoch', range: [min + 2 * w, max], items: [] },
  ];
  pairs.forEach(p => {
    const idx = Math.min(2, Math.max(0, Math.floor((p.dose - min) / w)));
    buckets[idx].items.push(p.value);
  });
  return buckets.map(b => ({
    label: b.label, range: b.range, n: b.items.length,
    avg: b.items.length ? b.items.reduce((s, v) => s + v, 0) / b.items.length : null,
  }));
}
function bucketBarWidth(buckets, b) {
  const vals = buckets.filter(x => x.avg != null).map(x => x.avg);
  if (!vals.length) return 0;
  const max = Math.max(...vals, 0.001);
  return b.avg != null ? (b.avg / max) * 100 : 0;
}

/* ---------- Automatische Erkenntnisse ---------- */
function generateInsights(sortedEntries, entries, allHabits, allMetrics) {
  const insights = [];
  allMetrics.forEach(metric => {
    const offset = metric.habitOffset || 0;
    allHabits.forEach(habit => {
      const withIt = [], withoutIt = [];
      sortedEntries.forEach(e => {
        if (e[metric.key] === '' || e[metric.key] == null) return;
        const habitEntry = offset === 0 ? e : entries[addDays(e.date, offset)];
        if (!habitEntry || habitEntry[habit.key] == null) return;
        (habitEntry[habit.key] === true ? withIt : withoutIt).push(Number(e[metric.key]));
      });
      if (withIt.length < 3 || withoutIt.length < 3) return;
      const avgWith = withIt.reduce((s, v) => s + v, 0) / withIt.length;
      const avgWithout = withoutIt.reduce((s, v) => s + v, 0) / withoutIt.length;
      const diff = avgWith - avgWithout;
      if (Math.abs(diff) < 0.01) return;
      const pct = Math.abs(avgWithout) > 0.01 ? Math.abs(diff / avgWithout) * 100 : null;
      insights.push({ metric, habit, diff, avgWith, avgWithout, withN: withIt.length, withoutN: withoutIt.length, magnitude: pct != null ? pct : Math.abs(diff) * 10 });
    });
  });
  insights.sort((a, b) => b.magnitude - a.magnitude);
  return insights.slice(0, 4);
}
function phraseInsight(ins) {
  const { metric, habit, avgWith, avgWithout, withN, withoutN } = ins;
  const better = avgWith > avgWithout;
  const diff = Math.abs(avgWith - avgWithout);
  const dayRef = metric.habitOffset ? ' am Vortag' : '';
  return `${metric.label} ist im Schnitt ${diff.toFixed(1)}${metric.unit} ${better ? 'höher' : 'niedriger'} an Tagen mit ${habit.label}${dayRef} (${avgWith.toFixed(1)} vs. ${avgWithout.toFixed(1)}, ${withN}/${withoutN} Tage).`;
}

/* ---------- Mini-Liniendiagramm ---------- */
function MiniLineChart({ data, color }) {
  if (data.length < 2) return null;
  const W = 300, H = 150, PAD = 26;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const points = data.map((d, i) => ({
    x: PAD + (i / (data.length - 1)) * (W - PAD * 2),
    y: H - PAD - ((d.value - min) / range) * (H - PAD * 2),
  }));
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 160 }}>
      <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke={COLORS.line} strokeWidth="1" />
      <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
      <text x={PAD} y={H - 8} fontSize="9" fontFamily="IBM Plex Mono" fill={COLORS.muted}>{data[0].date}</text>
      <text x={W - PAD} y={H - 8} fontSize="9" fontFamily="IBM Plex Mono" fill={COLORS.muted} textAnchor="end">{data[data.length - 1].date}</text>
      <text x={PAD} y={PAD - 8} fontSize="9" fontFamily="IBM Plex Mono" fill={COLORS.muted}>{max.toFixed(1)}</text>
      <text x={PAD} y={H - PAD + 12} fontSize="9" fontFamily="IBM Plex Mono" fill={COLORS.muted}>{min.toFixed(1)}</text>
    </svg>
  );
}

/* ---------- Wochentag-Balken ---------- */
function WeekdayChart({ data, color }) {
  const valid = data.filter(d => d.avg != null);
  if (valid.length < 3) return null;
  const W = 300, H = 130, PAD = 22;
  const maxV = Math.max(...valid.map(d => d.avg));
  const minV = Math.min(...valid.map(d => d.avg));
  const range = (maxV - minV) || 1;
  const barW = (W - PAD * 2) / data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 140 }}>
      <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke={COLORS.line} strokeWidth="1" />
      {data.map((d, i) => {
        const x = PAD + i * barW + barW * 0.22;
        const w = barW * 0.56;
        const h = d.avg == null ? 0 : Math.max(4, ((d.avg - minV) / range) * (H - PAD * 2 - 10) + 6);
        const y = H - PAD - h;
        return (
          <g key={d.label}>
            {d.avg != null && <rect x={x} y={y} width={w} height={h} rx="3" fill={color} opacity={d.n < 2 ? 0.35 : 1} />}
            <text x={x + w / 2} y={H - 7} fontSize="9" fontFamily="IBM Plex Mono" fill={COLORS.muted} textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- Hauptkomponente ---------- */
function HealthTracker() {
  const [entries, setEntries] = useState({});
  const [customHabits, setCustomHabits] = useState([]);
  const [customMetrics, setCustomMetrics] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState('today');
  const [currentDate, setCurrentDate] = useState(todayStr());
  const [form, setForm] = useState(emptyEntry(todayStr()));
  const [saveStatus, setSaveStatus] = useState('idle');
  const [selectedMetric, setSelectedMetric] = useState('sleepScore');

  useEffect(() => {
    setEntries(loadJSON(STORAGE_KEY, {}));
    setCustomHabits(loadJSON(CUSTOM_HABITS_KEY, []));
    setCustomMetrics(loadJSON(CUSTOM_METRICS_KEY, []));
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setForm(entries[currentDate] || emptyEntry(currentDate));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentDate, loaded]);

  function handleSave() {
    const updated = { ...entries, [currentDate]: { ...form, date: currentDate } };
    setEntries(updated);
    setSaveStatus('saving');
    const ok = saveJSON(STORAGE_KEY, updated);
    if (ok) { setSaveStatus('saved'); setTimeout(() => setSaveStatus('idle'), 2000); }
    else setSaveStatus('error');
  }

  function addCustomHabit(label) {
    const trimmed = label.trim();
    if (!trimmed) return;
    const updated = [...customHabits, { key: `custom_${Date.now()}`, label: trimmed }];
    setCustomHabits(updated);
    saveJSON(CUSTOM_HABITS_KEY, updated);
  }
  function removeCustomHabit(key) {
    const updated = customHabits.filter(h => h.key !== key);
    setCustomHabits(updated);
    saveJSON(CUSTOM_HABITS_KEY, updated);
  }
  function addCustomMetric(label, unit) {
    const trimmed = label.trim();
    if (!trimmed) return;
    const updated = [...customMetrics, { key: `custom_metric_${Date.now()}`, label: trimmed, unit: (unit || '').trim() }];
    setCustomMetrics(updated);
    saveJSON(CUSTOM_METRICS_KEY, updated);
  }
  function removeCustomMetric(key) {
    const updated = customMetrics.filter(m => m.key !== key);
    setCustomMetrics(updated);
    saveJSON(CUSTOM_METRICS_KEY, updated);
  }

  function handleImportData(data) {
    const mergedEntries = { ...entries, ...(data.entries || {}) };
    setEntries(mergedEntries);
    saveJSON(STORAGE_KEY, mergedEntries);

    const importedHabits = data.customHabits || [];
    const existingHabitKeys = new Set(customHabits.map(h => h.key));
    const mergedHabits = [...customHabits, ...importedHabits.filter(h => !existingHabitKeys.has(h.key))];
    setCustomHabits(mergedHabits);
    saveJSON(CUSTOM_HABITS_KEY, mergedHabits);

    const importedMetrics = data.customMetrics || [];
    const existingMetricKeys = new Set(customMetrics.map(m => m.key));
    const mergedMetrics = [...customMetrics, ...importedMetrics.filter(m => !existingMetricKeys.has(m.key))];
    setCustomMetrics(mergedMetrics);
    saveJSON(CUSTOM_METRICS_KEY, mergedMetrics);
  }

  function updateField(key, value) { setForm(f => ({ ...f, [key]: value })); }
  function shiftDate(days) { setCurrentDate(addDays(currentDate, days)); }

  const sortedEntries = useMemo(
    () => Object.values(entries).sort((a, b) => b.date.localeCompare(a.date)),
    [entries]
  );

  const allHabits = useMemo(
    () => [...HABITS, ...customHabits.map(h => ({ ...h, iconName: 'sparkles' }))],
    [customHabits]
  );
  const allMetrics = useMemo(
    () => [...METRICS, ...customMetrics.map(m => ({ ...m, color: COLORS.custom, habitOffset: 0 }))],
    [customMetrics]
  );

  const chartData = useMemo(() => {
    return sortedEntries
      .filter(e => e[selectedMetric] !== '' && e[selectedMetric] != null)
      .map(e => ({ date: formatDateLabel(e.date), value: Number(e[selectedMetric]) }))
      .reverse();
  }, [sortedEntries, selectedMetric]);

  const correlations = useMemo(() => {
    const currentMetric = allMetrics.find(m => m.key === selectedMetric);
    const offset = (currentMetric && currentMetric.habitOffset) || 0;
    return allHabits.map(habit => {
      const withIt = [], withoutIt = [];
      sortedEntries.forEach(e => {
        if (e[selectedMetric] === '' || e[selectedMetric] == null) return;
        const habitEntry = offset === 0 ? e : entries[addDays(e.date, offset)];
        if (!habitEntry || habitEntry[habit.key] == null) return;
        (habitEntry[habit.key] === true ? withIt : withoutIt).push(e);
      });
      if (withIt.length < 2 || withoutIt.length < 2) return { ...habit, enough: false };
      const avg = arr => arr.reduce((s, e) => s + Number(e[selectedMetric]), 0) / arr.length;
      return { ...habit, enough: true, withAvg: avg(withIt), withoutAvg: avg(withoutIt) };
    });
  }, [sortedEntries, selectedMetric, entries, allHabits, allMetrics]);

  const insights = useMemo(
    () => generateInsights(sortedEntries, entries, allHabits, allMetrics),
    [sortedEntries, entries, allHabits, allMetrics]
  );

  const metric = allMetrics.find(m => m.key === selectedMetric);

  return (
    <div style={{ minHeight: '100vh', backgroundColor: COLORS.mist, display: 'flex', flexDirection: 'column' }}>
      <header style={{ backgroundColor: COLORS.ink, padding: '28px 20px 20px' }}>
        <h1 className="ht-display" style={{ color: 'white', fontSize: 24, margin: 0 }}>Abendrunde</h1>
        <p style={{ color: '#AEB4C7', fontSize: 14, marginTop: 4 }}>Gewohnheiten &amp; Fitness im Blick</p>
      </header>
      <div style={{ height: 4, background: `linear-gradient(90deg, ${COLORS.sage}, ${COLORS.ember}, ${COLORS.dusk})` }} />

      <main style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 96px', maxWidth: 480, margin: '0 auto', width: '100%' }}>
        {tab === 'today' && (
          <TodayView currentDate={currentDate} form={form} updateField={updateField} shiftDate={shiftDate} handleSave={handleSave} saveStatus={saveStatus}
            customHabits={customHabits} addCustomHabit={addCustomHabit} removeCustomHabit={removeCustomHabit}
            customMetrics={customMetrics} addCustomMetric={addCustomMetric} removeCustomMetric={removeCustomMetric} />
        )}
        {tab === 'history' && (
          <HistoryView sortedEntries={sortedEntries} customHabits={customHabits} onSelect={(date) => { setCurrentDate(date); setTab('today'); }} />
        )}
        {tab === 'trends' && (
          <TrendsView sortedEntries={sortedEntries} entries={entries} chartData={chartData} correlations={correlations}
            selectedMetric={selectedMetric} setSelectedMetric={setSelectedMetric} metric={metric} allMetrics={allMetrics}
            entryCount={sortedEntries.length} insights={insights} />
        )}
        {tab === 'data' && (
          <DataView entries={entries} customHabits={customHabits} customMetrics={customMetrics} onImport={handleImportData} />
        )}
      </main>

      <nav style={{ position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: 'white', borderTop: `1px solid ${COLORS.line}` }}>
        <div style={{ maxWidth: 480, margin: '0 auto', display: 'flex', justifyContent: 'space-around' }}>
          <TabButton iconName="calendar" label="Heute" active={tab === 'today'} onClick={() => setTab('today')} />
          <TabButton iconName="moon" label="Verlauf" active={tab === 'history'} onClick={() => setTab('history')} />
          <TabButton iconName="trendingUp" label="Trends" active={tab === 'trends'} onClick={() => setTab('trends')} />
          <TabButton iconName="download" label="Daten" active={tab === 'data'} onClick={() => setTab('data')} />
        </div>
      </nav>
    </div>
  );
}

function TabButton({ iconName, label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ background: 'none', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '12px 16px', flex: 1, color: active ? COLORS.dusk : COLORS.muted }}>
      <Icon name={iconName} size={20} style={{ strokeWidth: active ? 2.5 : 2 }} />
      <span style={{ fontSize: 11, fontWeight: 500 }}>{label}</span>
    </button>
  );
}

function Card({ children }) {
  return <div style={{ backgroundColor: 'white', borderRadius: 16, padding: '12px 16px', border: `1px solid ${COLORS.line}` }}>{children}</div>;
}

function NumberField({ label, iconName, value, onChange, unit, placeholder, onRemove }) {
  return (
    <Card>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <Icon name={iconName} size={18} style={{ color: COLORS.dusk, flexShrink: 0 }} />
        <label style={{ flex: 1, fontSize: 14, color: COLORS.ink }}>{label}</label>
        <input
          type="number" inputMode="decimal" value={value}
          onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
          className="ht-mono"
          style={{ width: 80, textAlign: 'right', borderRadius: 8, padding: '6px 8px', fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: COLORS.mist }}
        />
        {unit && <span className="ht-mono" style={{ fontSize: 12, width: 32, color: COLORS.muted }}>{unit}</span>}
        {onRemove && (
          <button onClick={onRemove} style={{ background: 'none', border: 'none', color: COLORS.muted, flexShrink: 0, padding: 2 }} aria-label="Feld entfernen">
            <Icon name="x" size={16} />
          </button>
        )}
      </div>
    </Card>
  );
}

function ToggleField({ label, iconName, value, onChange, extra, onRemove }) {
  return (
    <Card>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <Icon name={iconName} size={18} style={{ color: COLORS.dusk, flexShrink: 0 }} />
        <label style={{ flex: 1, fontSize: 14, color: COLORS.ink }}>{label}</label>
        <div style={{ display: 'flex', gap: 6 }}>
          <button onClick={() => onChange(true)} style={{ padding: '6px 12px', borderRadius: 8, fontSize: 14, fontWeight: 500, border: 'none', ...(value === true ? { backgroundColor: COLORS.dusk, color: 'white' } : { backgroundColor: COLORS.mist, color: COLORS.muted }) }}>Ja</button>
          <button onClick={() => onChange(false)} style={{ padding: '6px 12px', borderRadius: 8, fontSize: 14, fontWeight: 500, border: 'none', ...(value === false ? { backgroundColor: COLORS.ink, color: 'white' } : { backgroundColor: COLORS.mist, color: COLORS.muted }) }}>Nein</button>
        </div>
        {onRemove && (
          <button onClick={onRemove} style={{ background: 'none', border: 'none', color: COLORS.muted, flexShrink: 0, padding: 2 }} aria-label="Frage entfernen">
            <Icon name="x" size={16} />
          </button>
        )}
      </div>
      {extra}
    </Card>
  );
}

function ScaleField({ label, value, onChange }) {
  return (
    <Card>
      <label style={{ fontSize: 14, color: COLORS.ink }}>{label}</label>
      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
        {[1, 2, 3, 4, 5].map(n => (
          <button key={n} onClick={() => onChange(n)} className="ht-mono" style={{ flex: 1, padding: '8px 0', borderRadius: 8, fontSize: 14, fontWeight: 500, border: 'none', ...(value === n ? { backgroundColor: COLORS.dusk, color: 'white' } : { backgroundColor: COLORS.mist, color: COLORS.muted }) }}>{n}</button>
        ))}
      </div>
    </Card>
  );
}

function AddCustomHabit({ onAdd }) {
  const [adding, setAdding] = useState(false);
  const [text, setText] = useState('');
  function submit() { if (!text.trim()) return; onAdd(text); setText(''); setAdding(false); }
  if (!adding) {
    return (
      <button onClick={() => setAdding(true)} style={{ width: '100%', padding: '10px 0', borderRadius: 12, fontSize: 12, fontWeight: 500, border: `1px dashed ${COLORS.line}`, backgroundColor: 'transparent', color: COLORS.dusk, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
        <Icon name="sparkles" size={14} /> Eigene Frage hinzufügen
      </button>
    );
  }
  return (
    <Card>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <input type="text" autoFocus value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="z. B. Meditiert"
          style={{ flex: 1, borderRadius: 8, padding: '6px 10px', fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: COLORS.mist, color: COLORS.ink }} />
        <button onClick={submit} style={{ padding: '6px 12px', borderRadius: 8, fontSize: 14, fontWeight: 500, border: 'none', backgroundColor: COLORS.dusk, color: 'white' }}>OK</button>
        <button onClick={() => { setAdding(false); setText(''); }} style={{ background: 'none', border: 'none', color: COLORS.muted }}><Icon name="x" size={16} /></button>
      </div>
    </Card>
  );
}

function AddCustomMetric({ onAdd }) {
  const [adding, setAdding] = useState(false);
  const [label, setLabel] = useState('');
  const [unit, setUnit] = useState('');
  function submit() { if (!label.trim()) return; onAdd(label, unit); setLabel(''); setUnit(''); setAdding(false); }
  if (!adding) {
    return (
      <button onClick={() => setAdding(true)} style={{ width: '100%', padding: '10px 0', borderRadius: 12, fontSize: 12, fontWeight: 500, border: `1px dashed ${COLORS.line}`, backgroundColor: 'transparent', color: COLORS.dusk, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
        <Icon name="sparkles" size={14} /> Eigenen Messwert hinzufügen
      </button>
    );
  }
  return (
    <Card>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <input type="text" autoFocus value={label} onChange={(e) => setLabel(e.target.value)} placeholder="z. B. Gewicht"
            style={{ flex: 2, borderRadius: 8, padding: '6px 10px', fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: COLORS.mist, color: COLORS.ink }} />
          <input type="text" value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="Einheit (kg)"
            style={{ flex: 1, borderRadius: 8, padding: '6px 10px', fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: COLORS.mist, color: COLORS.ink }} />
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={submit} style={{ flex: 1, padding: '6px 12px', borderRadius: 8, fontSize: 14, fontWeight: 500, border: 'none', backgroundColor: COLORS.dusk, color: 'white' }}>Hinzufügen</button>
          <button onClick={() => { setAdding(false); setLabel(''); setUnit(''); }} style={{ background: 'none', border: 'none', color: COLORS.muted }}><Icon name="x" size={16} /></button>
        </div>
      </div>
    </Card>
  );
}

function InsightsSection({ insights }) {

      </h3>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>

          <p key={i} style={{ fontSize: 13, color: COLORS.ink, margin: 0, lineHeight: 1.5 }}>{phraseInsight(ins)}</p>

function DoseResponseSection({ sortedEntries, entries, metric, allMetrics }) {
  const candidates = allMetrics.filter(m => m.key !== metric.key);
  const [doseKey, setDoseKey] = useState(candidates[0] ? candidates[0].key : null);
  if (candidates.length === 0) return null;
  const doseMetric = candidates.find(c => c.key === doseKey);
  const buckets = useMemo(() => doseKey ? computeDoseResponse(sortedEntries, entries, metric, doseKey) : null, [sortedEntries, entries, metric, doseKey]);
  return (
    <Card>
      <h3 style={{ fontSize: 14, fontWeight: 500, margin: '0 0 4px', color: COLORS.ink }}>Menge &amp; Wirkung</h3>
      <p style={{ fontSize: 12, margin: '0 0 10px', color: COLORS.muted }}>Wie verändert sich {metric.label} mit der Menge von…</p>
      <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4, marginBottom: 12 }}>
        {candidates.map(c => (
          <button key={c.key} onClick={() => setDoseKey(c.key)} style={{ padding: '5px 10px', borderRadius: 8, fontSize: 11, fontWeight: 500, whiteSpace: 'nowrap', ...(doseKey === c.key ? { backgroundColor: COLORS.custom, color: 'white', border: `1px solid ${COLORS.custom}` } : { backgroundColor: 'white', color: COLORS.muted, border: `1px solid ${COLORS.line}` }) }}>{c.label}</button>
        ))}
      </div>
      {buckets ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {buckets.map((b, i) => (
            <div key={b.label}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: COLORS.muted, marginBottom: 2 }}>
                <span>{b.label} ({b.range[0].toFixed(1)}–{b.range[1].toFixed(1)}{doseMetric ? doseMetric.unit : ''})</span>
                <span className="ht-mono">{b.avg != null ? `${b.avg.toFixed(1)}${metric.unit}` : '–'}{b.n ? ` (n=${b.n})` : ''}</span>
              </div>
              <div style={{ borderRadius: 4, height: 10, backgroundColor: COLORS.mist }}>
                {b.avg != null && <div style={{ height: 10, borderRadius: 4, backgroundColor: metric.color, opacity: 0.4 + i * 0.3, width: `${bucketBarWidth(buckets, b)}%` }} />}
              </div>
            </div>
          ))}
        </div>
      ) : (
        <p style={{ fontSize: 12, color: COLORS.muted }}>Noch zu wenig Variation oder Daten für diesen Vergleich.</p>
      )}
    </Card>
  );
}

function TrendsView({ sortedEntries, entries, chartData, correlations, selectedMetric, setSelectedMetric, metric, allMetrics, entryCount, insights }) {
  const weekdayRaw = useMemo(() => weekdayPattern(sortedEntries, selectedMetric), [sortedEntries, selectedMetric]);
  const weekdayOrdered = useMemo(() => [1, 2, 3, 4, 5, 6, 0].map(i => weekdayRaw[i]), [weekdayRaw]);

  if (entryCount < 3) return <EmptyState text={`Noch ${3 - entryCount} Tag(e) bis zu den ersten Trends.`} />;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <InsightsSection insights={insights} />

      <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 4 }}>
        {allMetrics.map(m => (
          <button key={m.key} onClick={() => setSelectedMetric(m.key)} style={{ padding: '6px 12px', borderRadius: 8, fontSize: 12, fontWeight: 500, whiteSpace: 'nowrap', ...(selectedMetric === m.key ? { backgroundColor: COLORS.dusk, color: 'white', border: `1px solid ${COLORS.dusk}` } : { backgroundColor: 'white', color: COLORS.muted, border: `1px solid ${COLORS.line}` }) }}>{m.label}</button>
        ))}
      </div>

      <Card>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: '0 0 12px', color: COLORS.ink }}>{metric.label} über Zeit</h3>
        {chartData.length >= 2 ? <MiniLineChart data={chartData} color={metric.color} /> : <p style={{ fontSize: 12, color: COLORS.muted }}>Noch zu wenige Daten für {metric.label}.</p>}
      </Card>

      <Card>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: '0 0 10px', color: COLORS.ink }}>Wochentag-Muster</h3>
        {weekdayOrdered.filter(d => d.n > 0).length >= 4 ? (
          <WeekdayChart data={weekdayOrdered} color={metric.color} />
        ) : (
          <p style={{ fontSize: 12, color: COLORS.muted }}>Noch zu wenig Daten pro Wochentag.</p>
        )}
      </Card>

      <Card>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: '0 0 12px', color: COLORS.ink }}>Was hängt mit {metric.label} zusammen?</h3>
        {metric.habitOffset ? <p style={{ fontSize: 12, marginBottom: 12, color: COLORS.muted }}>Verglichen mit den Gewohnheiten vom Vortag, da sich {metric.label} auf die Nacht davor bezieht.</p> : null}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {correlations.map(c => (
            <div key={c.key}>
              {c.enough ? <CorrelationBar habit={c} metric={metric} /> : <p style={{ fontSize: 12, color: COLORS.muted }}>{c.label}: noch zu wenig Daten</p>}
            </div>
          ))}
        </div>
        <p style={{ fontSize: 12, marginTop: 12, color: COLORS.muted }}>Durchschnittswerte aus deinen Einträgen – ein Zusammenhang, keine Diagnose.</p>
      </Card>

      <DoseResponseSection key={metric.key} sortedEntries={sortedEntries} entries={entries} metric={metric} allMetrics={allMetrics} />
    </div>
  );
}

function CorrelationBar({ habit, metric }) {
  const max = Math.max(habit.withAvg, habit.withoutAvg, 0.001);
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
        <Icon name={habit.iconName} size={14} style={{ color: COLORS.muted }} />
        <span style={{ fontSize: 12, color: COLORS.ink }}>{habit.label}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, marginBottom: 2, color: COLORS.muted }}>
        <span style={{ width: 36 }}>Ja</span>
        <div style={{ flex: 1, borderRadius: 4, height: 10, backgroundColor: COLORS.mist }}>
          <div style={{ height: 10, borderRadius: 4, width: `${(habit.withAvg / max) * 100}%`, backgroundColor: COLORS.dusk }} />
        </div>
        <span className="ht-mono" style={{ width: 48, textAlign: 'right' }}>{habit.withAvg.toFixed(1)}{metric.unit}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: COLORS.muted }}>
        <span style={{ width: 36 }}>Nein</span>
        <div style={{ flex: 1, borderRadius: 4, height: 10, backgroundColor: COLORS.mist }}>
          <div style={{ height: 10, borderRadius: 4, width: `${(habit.withoutAvg / max) * 100}%`, backgroundColor: COLORS.ink }} />
        </div>
        <span className="ht-mono" style={{ width: 48, textAlign: 'right' }}>{habit.withoutAvg.toFixed(1)}{metric.unit}</span>
      </div>
    </div>
  );
}

function DataView({ entries, customHabits, customMetrics, onImport }) {
  const dates = Object.keys(entries).sort();
  const count = dates.length;
  const first = dates[0];
  const fileInputRef = useRef(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('Backup importieren und mit den aktuellen Daten zusammenführen? Bei gleichen Tagen gewinnt das Backup.')) {
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.entries) throw new Error('bad format');
        onImport(data);
        alert('Import erfolgreich.');
      } catch (err) {
        alert('Import fehlgeschlagen: Das ist keine gültige Abendrunde-Backup-Datei.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <Card>
        <p style={{ fontSize: 14, color: COLORS.ink, margin: 0 }}>
          {count === 0 ? 'Noch keine Einträge.' : <>{count} {count === 1 ? 'Tag' : 'Tage'} protokolliert{first ? `, seit ${formatDateLabel(first)}` : ''}.</>}
        </p>
      </Card>

      <section>
        <h2 style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em', color: COLORS.muted, margin: '0 0 8px 4px' }}>Sichern</h2>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button onClick={() => exportJSON(entries, customHabits, customMetrics)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, width: '100%', padding: '12px 0', borderRadius: 16, fontWeight: 500, fontSize: 14, border: 'none', backgroundColor: COLORS.dusk, color: 'white' }}>
            <Icon name="download" size={18} /> Als JSON exportieren (Backup)
          </button>
          <button onClick={() => exportCSV(entries, customHabits, customMetrics)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, width: '100%', padding: '12px 0', borderRadius: 16, fontWeight: 500, fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: 'white', color: COLORS.ink }}>
            <Icon name="download" size={18} /> Als CSV exportieren (für Excel)
          </button>
        </div>
        <p style={{ fontSize: 11, color: COLORS.muted, margin: '8px 4px 0' }}>JSON ist das vollständige Backup zum Wiederherstellen. CSV ist zum Ansehen/Rechnen in Excel oder Google Sheets.</p>
      </section>

      <section>
        <h2 style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em', color: COLORS.muted, margin: '0 0 8px 4px' }}>Wiederherstellen</h2>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={handleFile} style={{ display: 'none' }} />
        <button onClick={() => fileInputRef.current.click()} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, width: '100%', padding: '12px 0', borderRadius: 16, fontWeight: 500, fontSize: 14, border: `1px solid ${COLORS.line}`, backgroundColor: 'white', color: COLORS.ink }}>
          <Icon name="upload" size={18} /> JSON-Backup importieren
        </button>
        <p style={{ fontSize: 11, color: COLORS.muted, margin: '8px 4px 0' }}>Nur JSON-Backups dieser App können importiert werden.</p>
      </section>
    </div>
  );
}

function EmptyState({ text }) {
  return <div style={{ textAlign: 'center', padding: '64px 24px' }}><p style={{ fontSize: 14, color: COLORS.muted }}>{text}</p></div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HealthTracker />);
</script>
</body>
</html>
